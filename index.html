<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자산 일기</title>
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="자산 일기">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="lockScreen" class="lock-screen" hidden></div>
<header class="topbar">
  <div class="topbar-inner">
    <div>
      <h1 id="screenTitle">자산 현황</h1>
      <span class="date" id="todayLabel"></span>
    </div>
    <button class="icon-btn" data-action="refresh-prices" aria-label="시세 새로고침" title="시세 새로고침"><i data-ic="refresh"></i></button>
  </div>
</header>

<main id="app" class="screen" aria-live="polite"></main>

<button id="fab" class="fab" hidden aria-label="추가"><i data-ic="plus"></i></button>

<nav class="tabbar" aria-label="탭">
  <button data-tab="home" class="on"><i data-ic="home"></i><span>홈</span></button>
  <button data-tab="assets"><i data-ic="wallet"></i><span>자산</span></button>
  <button data-tab="book"><i data-ic="book"></i><span>가계부</span></button>
  <button data-tab="tx"><i data-ic="swap"></i><span>거래</span></button>
  <button data-tab="rebal"><i data-ic="scale"></i><span>균형</span></button>
  <button data-tab="settings"><i data-ic="sliders"></i><span>설정</span></button>
</nav>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <button class="link-btn" data-action="close-sheet">닫기</button>
      <h2 id="sheetTitle"></h2>
      <button class="link-btn strong" id="sheetSave">저장</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
